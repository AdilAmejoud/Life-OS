##############################################################
# docker-compose.yml — Life_OS_v2
# Run with: docker compose up -d
##############################################################

services:

  glance:
    container_name: Life_OS
    image: glanceapp/glance:latest
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .secrets/.env.production
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./config/assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 8090:8080
    depends_on:
      - notion-proxy
      - pomodoro
      - task-api
    networks:
      - life-os

  notion-proxy:
    container_name: notion-proxy
    image: node:20-alpine
    env_file:
      - .secrets/.env.production
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./apps/notion-proxy/backend:/app
    command: node server.js
    ports:
      - 3456:3456
    networks:
      - life-os

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n
    env_file:
      - .secrets/.env.production
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - 5678:5678
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=Africa/Casablanca
      - GITHUB_TOKEN=${GH_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - life-os

  ai-assistant:
    container_name: ai-assistant
    image: node:20-alpine
    env_file:
      - .secrets/.env.production
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./apps/ai-assistant/backend:/app
      - ./apps/ai-assistant/frontend:/app/frontend
      - ai-assistant_data:/app/data
    command: sh -c "npm install sqlite3 && node server.js"
    ports:
      - 3700:3700
    environment:
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - AI_ASSISTANT_DB_PATH=/app/data/conversations.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - life-os



  pomodoro:
    container_name: pomodoro
    image: node:20-alpine
    env_file:
      - .secrets/.env.production
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./apps/pomodoro/backend/server.js:/app/server.js
      - ./apps/pomodoro/frontend/dist:/app/dist
    command: node server.js
    ports:
      - 3800:3800
    networks:
      - life-os

  task-api:
    container_name: task-api
    image: node:20-slim
    env_file:
      - .secrets/.env.production
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./apps/task-manager/backend:/app
      - ./shared:/app/assets
    command: sh -c "apt-get update && apt-get install -y python3 make g++ && npm install --build-from-source && npm start"
    ports:
      - 3100:3100
    environment:
      - NODE_ENV=production
      - TASK_API_PORT=3100
    networks:
      - life-os

  youtube-proxy:
    container_name: youtube-proxy
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./apps/youtube-proxy/backend:/app
    command: node server.js
    ports:
      - 3704:3704
    networks:
      - life-os

  content-api:
    image: node:20-alpine
    container_name: life-os-content-api
    working_dir: /app
    volumes:
      - ./apps/content-api/backend:/app
      - ./config/content-data.json:/app/data/content-data.json
    ports:
      - "3950:3950"
    command: node content-api-server.js
    restart: unless-stopped
    env_file:
      - .secrets/.env.production
    networks:
      - life-os

  super-productivity:
    container_name: super-productivity
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      # Map the build folder
      - ./external/super-productivity/.tmp/angular-dist:/app/dist 
      # FIX: Updated path to match where you created the file
      - ./apps/super-productivity/backend/super-prod-server.js:/app/server.js
    command: sh -c "npm install express && node server.js"
    ports:
      - 3900:3900
    networks:
      - life-os  

networks:
  life-os:
    driver: bridge

volumes:
  n8n_data:
  ai-assistant_data: